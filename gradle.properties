# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4 GB: packageRelease ran out of heap at 2 GB in the central release build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# FIX: Explicitly set JDK home and installations to avoid broken JRE paths from IDE extensions (e.g. redhat.java)
#org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
#org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64
#org.gradle.java.installations.auto-detect=false
#org.gradle.java.installations.fromEnv=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of libraries
android.nonTransitiveRClass=true

# Configuration cache stays off. (The note that was here blamed the Navigation Component's
# ProcessNavigationXmlTask, but the app uses Compose navigation and has no navigation XML, so
# that was not the reason.) No incompatibility has been found; it has simply not been tried
# with this build. Run a build with --configuration-cache to find out before turning it on.
org.gradle.configuration-cache=false

# R8 full mode stays off. (The note that was here blamed ARCore, which this app doesn't use.)
# The real reason: full mode drops default constructors and generic signatures that Gson
# needs to read sources.json and the GitHub release reply into Kotlin classes, beyond what
# the keep rules in proguard-rules.pro cover. Turning it on needs a release build run
# against those reads first; CI's R8 seeds check only proves the classes are kept.
android.r8.forceDisableFullMode=true

# KOTLIN METADATA FIX: Suppress built-in kotlin source set issue.
android.disallowKotlinSourceSets=false
